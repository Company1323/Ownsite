
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تمام اخبار | MyWebsite</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="news-page">

        <header class="news-page-header">
            <a href="index.html" class="back-home">← بازگشت به صفحه اصلی</a>

            <h1>مرکز اخبار</h1>

            <p>تمام اخبار روز از منابع مختلف فارسی و انگلیسی</p>
        </header>

        <nav class="news-filters">
            <button class="active" data-category="all">همه اخبار</button>
            <button data-category="war">جنگ</button>
            <button data-category="technology">تکنولوژی</button>
            <button data-category="gaming">گیم</button>
            <button data-category="football">فوتبال</button>
        </nav>

        <div class="news-page-info">
            <span id="newsCount">در حال دریافت اخبار...</span>

            <button id="refreshNews">بروزرسانی ↻</button>
        </div>

        <div class="news-content" id="newsContent">
            <p class="news-message">در حال دریافت اخبار...</p>
        </div>

    </main>

    <script src="news.js"></script>

</body>
</html>
